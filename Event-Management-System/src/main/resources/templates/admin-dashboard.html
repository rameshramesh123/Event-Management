
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | EventPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">

    <style>
        :root {
            --sidebar-width: 260px;
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --bg-light: #f8f9fc;
            --text-dark: #2b2d42;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-width);
            min-height: 100vh;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            position: fixed;
            transition: all 0.3s;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar a {
            color: #94a3b8;
            text-decoration: none;
            display: flex;
            align-items: center;
            padding: 15px 25px;
            margin: 5px 15px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .sidebar a i { margin-right: 12px; font-size: 1.1rem; }

        .sidebar a:hover, .sidebar a.active {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        /* --- MAIN CONTENT --- */
        .main-wrapper {
            margin-left: var(--sidebar-width);
            width: calc(100% - var(--sidebar-width));
            transition: all 0.3s;
        }

        .top-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-bottom: 1px solid #e2e8f0;
        }

        /* --- STATS CARDS --- */
        .stat-card {
            border: none;
            border-radius: 15px;
            transition: transform 0.3s ease;
            background: #fff;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .icon-shape {
            width: 48px;
            height: 48px;
            background: rgba(67, 97, 238, 0.1);
            color: var(--primary-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        /* --- TABLE STYLE --- */
        .content-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            background: #fff;
        }

        .table thead th {
            background-color: #f8fafc;
            border-bottom-width: 1px;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: #64748b;
            padding: 15px;
        }

        .table td { padding: 15px; vertical-align: middle; }

        .btn-action {
            width: 35px;
            height: 35px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            margin: 0 2px;
        }

        .badge-user {
            background-color: #e0e7ff;
            color: #3f37c9;
            padding: 3px 8px;
            border-radius: 12px;
            margin: 2px;
            font-size: 0.75rem;
            display: inline-block;
        }

        @media (max-width: 768px) {
            .sidebar { margin-left: calc(-1 * var(--sidebar-width)); }
            .main-wrapper { margin-left: 0; width: 100%; }
            .sidebar.active { margin-left: 0; }
        }
    </style>
</head>
<body>

<div class="d-flex">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h4 class="text-white fw-bold"><i class="fas fa-calendar-check me-2"></i>EventPro</h4>
        </div>
        <div class="mt-4">
            <a th:href="@{/admin/dashboard}" class="active"><i class="fas fa-chart-pie"></i> Dashboard</a>
            <a th:href="@{/admin/add-event}"><i class="fas fa-plus-circle"></i> Add Event</a>
            <a href="#"><i class="fas fa-users"></i> Users</a>
            <a href="#"><i class="fas fa-cog"></i> Settings</a>
            <hr class="mx-3" style="border-color: rgba(255,255,255,0.1);">
            <a th:href="@{/logout}" class="text-danger"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-wrapper">
        <!-- Top Navigation -->
        <nav class="top-nav d-flex justify-content-between align-items-center">
            <h5 class="fw-bold mb-0">Overview</h5>
            <div class="d-flex align-items-center">
                <span class="me-3 text-muted">Admin User</span>
                <img src="https://ui-avatars.com/api/?name=Admin&background=4361ee&color=fff" class="rounded-circle" width="35" alt="Avatar">
            </div>
        </nav>

        <div class="p-4">
            <!-- Stats Cards: Total Events, Total Users, Booked Users -->
            <div class="row mb-4">
                <!-- Total Events -->
                <div class="col-md-4 mb-3">
                    <div class="card stat-card shadow-sm p-3">
                        <div class="d-flex align-items-center">
                            <div class="icon-shape shadow-sm">
                                <i class="fas fa-calendar-day"></i>
                            </div>
                            <div class="ms-3">
                                <p class="text-muted mb-0 small uppercase fw-bold">Total Events</p>
                                <h3 class="fw-bold mb-0" th:text="${totalEvents}">12</h3>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Total Users -->
                <div class="col-md-4 mb-3">
                    <div class="card stat-card shadow-sm p-3">
                        <div class="d-flex align-items-center">
                            <div class="icon-shape shadow-sm">
                                <i class="fas fa-users"></i>
                            </div>
                            <div class="ms-3">
                                <p class="text-muted mb-0 small uppercase fw-bold">Total Users</p>
                                <h3 class="fw-bold mb-0" th:text="${totalUsers}">50</h3>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Booked Users Count -->
                <div class="col-md-4 mb-3">
                    <div class="card stat-card shadow-sm p-3">
                        <div class="d-flex align-items-center">
                            <div class="icon-shape shadow-sm">
                                <i class="fas fa-check-circle"></i>
                            </div>
                            <div class="ms-3">
                                <p class="text-muted mb-0 small uppercase fw-bold">Booked Users</p>
                                <h3 class="fw-bold mb-0" th:text="${bookedUsersCount}">20</h3>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Events Table -->
            <div class="card content-card">
                <div class="card-body p-0">
                    <div class="p-4 d-flex justify-content-between align-items-center">
                        <h5 class="fw-bold mb-0">Events List</h5>
                        <button class="btn btn-primary btn-sm rounded-pill px-3">Export CSV</button>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                            <tr>
                                <th>Event Details</th>
                                <th>Location</th>
                                <th>Date</th>
                                <th>Booked Users</th>
                                <th class="text-center">Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="event : ${events}">
                                <td>
                                    <div class="fw-bold text-primary" th:text="${event.title}">Concert</div>
                                </td>
                                <td>
                                    <i class="fas fa-map-marker-alt text-muted me-1"></i>
                                    <span th:text="${event.location}">New York</span>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border" th:text="${event.eventDate}">2023-12-01</span>
                                </td>
                                <td>
                                        <span th:each="booking : ${bookings}"
                                              th:if="${booking.event.id == event.id}"
                                              th:text="${booking.user.name}"
                                              class="badge-user">John Doe</span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/admin/edit/{id}(id=${event.id})}" class="btn btn-action btn-outline-warning">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <a th:href="@{/admin/delete/{id}(id=${event.id})}" class="btn btn-action btn-outline-danger">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
