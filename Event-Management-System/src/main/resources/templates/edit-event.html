<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Event | EventPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --sidebar-bg: #0f172a;
            --bg-light: #f1f5f9;
            --glass-white: rgba(255, 255, 255, 0.9);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-light);
            color: #1e293b;
            margin: 0;
            letter-spacing: -0.01em;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 280px;
            min-height: 100vh;
            background: var(--sidebar-bg);
            position: fixed;
            z-index: 100;
        }

        .sidebar-header {
            padding: 40px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar a {
            color: #94a3b8;
            text-decoration: none;
            display: flex;
            align-items: center;
            padding: 14px 24px;
            margin: 4px 16px;
            border-radius: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .sidebar a i { font-size: 1.1rem; width: 25px; }

        .sidebar a:hover, .sidebar a.active {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        /* --- MAIN WRAPPER --- */
        .main-wrapper {
            margin-left: 280px;
            width: calc(100% - 280px);
            min-height: 100vh;
        }

        .top-nav {
            background: var(--glass-white);
            backdrop-filter: blur(10px);
            padding: 20px 40px;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 90;
        }

        /* --- FORM DESIGN --- */
        .page-content {
            padding: 40px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .form-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
            padding: 40px;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }

        .form-label {
            font-weight: 600;
            color: #475569;
            font-size: 0.85rem;
            margin-bottom: 8px;
            display: block;
        }

        .input-group-text {
            background-color: #f8fafc;
            border: 2px solid #f1f5f9;
            border-right: none;
            border-radius: 12px 0 0 12px;
            color: #64748b;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px 16px;
            border: 2px solid #f1f5f9;
            background-color: #f8fafc;
            font-size: 0.95rem;
            color: #1e293b;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            background-color: #fff;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            outline: none;
        }

        /* --- BUTTONS --- */
        .btn-update {
            background: var(--primary-gradient);
            border: none;
            border-radius: 12px;
            padding: 14px 32px;
            font-weight: 700;
            color: white;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
            transition: all 0.3s ease;
        }

        .btn-update:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(99, 102, 241, 0.4);
            color: white;
        }

        .btn-cancel {
            background: #fff;
            border: 2px solid #f1f5f9;
            border-radius: 12px;
            padding: 12px 24px;
            font-weight: 600;
            color: #64748b;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-cancel:hover {
            background: #f1f5f9;
            color: #1e293b;
        }
    </style>
</head>
<body>

<div class="d-flex">
    <div class="sidebar">
        <div class="sidebar-header text-center">
            <h3 class="text-white fw-800 m-0" style="letter-spacing: -1px;">
                <i class="fas fa-bolt-lightning me-2 text-warning"></i>EventPro
            </h3>
        </div>
        <div class="mt-4">
            <a th:href="@{/admin/dashboard}"><i class="fas fa-grid-2"></i> Dashboard</a>
            <a th:href="@{/admin/add-event}"><i class="fas fa-plus-circle"></i> Add Event</a>
            <a href="#"><i class="fas fa-user-group"></i> Users</a>
            <hr class="mx-4 opacity-10">
            <a th:href="@{/logout}" class="text-danger mt-5"><i class="fas fa-arrow-right-from-bracket"></i> Logout</a>
        </div>
    </div>

    <div class="main-wrapper">
        <nav class="top-nav d-flex justify-content-between align-items-center">
            <h5 class="fw-bold m-0 text-primary">Edit Event Portal</h5>
            <div class="d-flex align-items-center bg-light p-1 pe-3 rounded-pill">
                <img src="https://ui-avatars.com/api/?name=Admin&background=6366f1&color=fff" class="rounded-circle me-2" width="32">
                <span class="fw-semibold small text-secondary">Administrator</span>
            </div>
        </nav>

        <div class="page-content">
            <div class="form-card">
                <div class="mb-5">
                    <h2 class="section-title">Modify Event Details</h2>
                    <p class="text-muted small">Update the information for your existing event. Changes will be reflected immediately.</p>
                </div>

                <form th:action="@{/admin/save-event}" th:object="${event}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="row g-4">
                        <div class="col-12">
                            <label class="form-label">Event Title</label>
                            <input type="text" th:field="*{title}" class="form-control" placeholder="Update title..." required>
                        </div>

                        <div class="col-md-7">
                            <label class="form-label">Venue Location</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-location-dot"></i></span>
                                <input type="text" th:field="*{location}" class="form-control" placeholder="Update venue address...">
                            </div>
                        </div>

                        <div class="col-md-5">
                            <label class="form-label">Event Date</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-calendar-days"></i></span>
                                <input type="date" th:field="*{eventDate}" class="form-control">
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end align-items-center mt-5 pt-4 border-top">
                        <a th:href="@{/admin/dashboard}" class="btn btn-cancel me-3">Discard Changes</a>
                        <button type="submit" class="btn btn-update">
                            <i class="fas fa-sync-alt me-2"></i> Update Event
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
